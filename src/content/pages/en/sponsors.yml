title: Sponsors
intro: ""
body:
  - Building a competition robot takes parts, tools, registration fees, and travel. Our sponsors cover those costs and give students in Salinas the opportunity to do real hands-on engineering.
why:
  title: Why Sponsor Us? 
  items:
    - title: Fund the season
      body: Support students today by covering their registration, materials, tools, safety equipment, food, lodging & transportation to competition events.
    - title: Reach students
      body: Support hands-on STEM education for high school students in the Salinas Valley. We also accept in-kind donations as well. Appreciated items include food, gift cards, wood, raw materials etc. 
    - title: Be recognized
      body: Your name on the robot, the pit, team shirts, this website, and at every event.
tiers:
  title: Sponsorship levels
  intro: Sponsorship amounts and full benefits are listed in our sponsorship packet.
  items:
    - name: Supporter
      benefits:
        - Name listed on team supporter list
        - Appreciation on team social media
    - name: Bronze
      benefits:
        - Name listed on banner
        - Recognition on team social media
        - All Supporter Benefits
    - name: Gold
      benefits:
        - Featured banner placement in pit area
        - Verbal recognition at competitions and community events
        - All Silver Benefits
    - name: Platinum
      benefits:
        - Tour of lab space
        - Customized Plaque
        - All Gold Benefits 

  packetNote: The sponsorship packet will be available for download soon. Interested in sponsoring? Email 2026frc6410@gmail.com 
grid:
  title: Our sponsors
  body: Thank you sponsors for supporting us!
cta:
  title: Ready to support the team?
  body: Contact us to talk about sponsorship, in-kind donations, or mentoring.
  actionLabel: Contact the team
