title: Join the Team!
intro: ""
body:
  - Whether you are a student who wants to build, a professional who wants to mentor, or a company that wants to help, there is a place for you here.
paths:
  - title: Students
    body: Any student at Everett Alvarez High School can join. No experience is needed. You will learn design, machining, wiring, programming, or on the business side you can support with merch design, marketing, sponsorships, youth outreach and so much more!
    steps:
      - Fill out an Application with Kumar
      - Interest Form 
      # - url: https://docs.google.com/forms/d/e/1FAIpQLSd1bYqw9l-D04EZo_1FecED1b0XwQvecVAyLCJmLeKWuj_C3A/viewform
    actionLabel: Learn about the Team
  - title: Mentors
    body: Engineers, programmers, machinists, teachers, and passionate community members are welcome to mentor. Mentors teach skills, keep the shop safe, and let students make the calls.
    steps:
      - Tell us about your background
      - Complete the school volunteer process
      - Join us in the shop
    actionLabel: Ask about mentoring
  - title: Sponsors
    body: Companies and community members fund the parts, tools, registration, and travel that make the season possible. Every level of support helps.
    steps:
      - Read our sponsorship page
      - Contact the team
      - Get recognized at every event
    actionLabel: See sponsorship
meeting:
  title: When and where we meet
  body: Location Room 106/107 at Everett Alvarez High School. WINGNUTS meets every Thursday during Homeroom during the regular school schedule, Fridays afterschool, as well as Saturday mornings. Meeting days may adapt and become more frequent as we near competition dates. 
