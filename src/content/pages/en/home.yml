title: FRC Team 6410 - Salinas, CA
description: WingNuts 6410 is the student FIRST Robotics Competition team at Everett Alvarez High School in Salinas, California.
hero:
  kicker: FIRST Robotics Competition Team 6410
  tagline: Students from Salinas building robots, and building each other up.
  lead: Every year we design, build, program, and compete with a new robot. Along the way we learn engineering, teamwork, and how to see a big project through.
  joinLabel: Join the team
  sponsorLabel: Become a sponsor
about:
  title: About us
  body:
    - WingNuts is the FRC team at Everett Alvarez High School. We are high school students who spend the season in the shop learning to design, machine, wire, and program a competition robot.
    - Students lead every part of the team, from mechanical design to sponsor outreach. Mentors help us learn the tools and stay safe, but the decisions are ours.
  actionLabel: Meet the team
