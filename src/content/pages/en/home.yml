title: FRC Team 6410 - Salinas, CA
description: WINGNUTS 6410 is a student-led robotics team at Everett Alvarez High School.
hero:
  kicker: FRC Team 6410
  tagline: Students from Salinas, California building robots, and building each other up.
  lead: Team 6410 is a high school robotics team based at Everett Alvarez High School, introducingstudents in grades 9 - 12 to STEM experiences through participation in competitive robotics all around Northern California. Our Robotics Team provides students with valuable hands on experience and opportunities related to future careers in fields such as computer programming,  engineering, and technology. Although our team is relatively small, we are actively recruiting new members and hope to continue growing our journey in the FIRST Robotics Competition. 
  joinLabel: Join the team
  sponsorLabel: Become a sponsor
  photo: 
    src: /images/2026/MS2026/IMG_20261115_140729.jpg
    alt: Monterey Scrimmage 2026 Group Photo
about:
  title: About us
  body:
    - "As our team number suggests, we are considered a “veteran team.” Team 6410 was created in 2017 , however operations ceased in 2019, where the team was previously known as “Supreme Eagles”. Team 6410 was brought back to life nearly a decade later in early 2026. We are currently a very small team of 5-6 students and are seeking to grow our program at EAHS."
    - "Students specialize in fields of:  Mechanical, Software, Electrical Engineering, as well as non-technical fields such as Fundrasing, Grants, Design, Outreach & so much more. "
    - "Join our team! Must be an EAHS student. "
  actionLabel: Meet the team
  photo: 
    src: /images/2026/MS2026/image_attachment.jpg
    alt: Team Photo
robot:
  label: "About FIRST"
  title: FIRST Robotics Competition
  body: For Inspiration and Recognition of Science and Technology (FIRST) is a non-profit organization founded by Dean Kamen in 1989 with the goal of inspiring young people to pursue an education in STEM-related fields. Through competition, cooperation, and gracious professionalism, FIRST reaches students throughout the United States and the world. You can find more information at firstinspires.org. The FIRST Robotics Competition is an annual competition in which teams from around the world design, program, and build industrial sized robots within a limited time frame in order to compete in games that change each year. 

  actionLabel: See our robots
  photo: 
    src: /images/2026/Logos/FIRST Logo (Color) .jpg
    alt: FIRST Photo
life:
  title: Team life
  intro: Building a robot is only part of the season. Here is what our first year of robotics looks like. 
  cards:
    - title: Workshops 
      caption: Students spend their off-season learning in workshops, specficially specializing in CAD, 3D Printing & Circuitry. In this photo, students are learning to create circuit cards, which they will then teach to local middle schoolers. 
      photo:
        src: /images/2026/Workshop.jpg
        alt: Workshop Photo
    - title: Off- Season Competitions
      caption: Our team was able to attend 3 off-season competitions in our first year! Getting driving practice was a tremendous win for our rookie team. 
      photo:
        src: /images/2026/Driving Practice.jpg
        alt: Competition Photo 
    - title: Community
      photo:
        src: /images/2026/Candybot.jpg
        alt: Community Photo
      caption: Our team strives to educate our community about STEM. As we are a new team, we are still building opportunities to engage with the youth about our operations and how impactful STEM education is. We are currently planning events in the near future to engage the youth, keep an eye out!
      
