about:
  title: About us
  body:
    - WINGNUTS is the FRC team at Everett Alvarez High School. We are high school students who spend the season in the shop learning to design, machine, wire, and program a competition robot.
    - Students lead every part of the team, from mechanical design to sponsor outreach. Mentors help us learn the tools and stay safe, but the decisions are ours.
  actionLabel: Meet the team
  photo: 
    src: /images/2026/MS2026/image_attachment.jpg
    alt: Team Photo
