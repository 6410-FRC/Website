title: Outreach
intro:  Sharing robotics and STEM with the Salinas Valley.
body:
  - Robotics should not stay inside our shop. We bring the robot and hands-on STEM activities to schools, families, and community events across the Salinas Valley.
programsTitle: Our programs
invite:
  title: Invite us to your event
  body: Planning a school or community event? Tell us about the audience, the date, and the space available, and we will find a way to be there.
  items:
    - Audience and age range
    - Date, time, and length of the event
    - Space, floor type, and access to power
  actionLabel: Contact the team
