process:
  title: Progression of a Robotics Season
  items:
    - title: Kickoff (January)
      body: In January, FIRST reveals a new game. The local Robotics teams in Monterey County all meet together to discuss strategy as well as recieve our kit of parts. This kit of parts is received by our team after paying registration.
    - title: Design & Build (January - February)
      body: We work together to build the "kitbot" which we then can test and reiterate for future competitions. We only have 6 weeks to fully develop our robot to prepare for competition.
    - title: Compete (March - April)
      body: We take the robot to regional events across Northern California, work in our pits between matches to repair or modify our robot, and scout other teams to learn about their operations.
