process:
  title: How a season works
  items:
    - title: Kickoff
      body: In January, FIRST reveals a new game. We read the rules and decide how we want to play it.
    - title: Design and build
      body: We prototype, model the robot in CAD, machine parts, wire it, and write the code.
    - title: Compete
      body: We take the robot to regional events, work in the pit between matches, and scout other teams.
