current:
  title: 2026 Rebuilt
  photo:
    src: /images/2026/Robot Photo.jpg
    alt: Robot Photo
  label: 2026 robot
  heading: Sticky Bot 
  body: This year's game, Rebuilt, is all about scoring fuel, crossing obstacles and preventing your opponent from scoring. Our robot primarily focused on defense, helping block opposing alliances while supporting our teammates on the field. Despite limited materials, resources, and experience as a rookie team, we persevered through mechanical issues and constant repairs, including replacing bent steel hex bars multiple times throughout the event. The robot represented not only our technical growth, but also our teamwork and determination as a first year team competing. Fun Fact, our robot has Pokemon cards as good luck boosts, these were found by chance unboxing our new 3D Printer! 
  # Our robot went through many different design iterations throughout the season as our team worked to improve performance and reliability. We began with a basic kitbot design, but quickly realized that our original launcher system did not generate enough power to consistently score game pieces into the goals. Through testing and troubleshooting, the team upgraded from CIM motors to brushless NEO motors to increase power and efficiency. Throughout  the progression of the competition, the robot was repeatedly redesigned and improved, including the addition of a double launcher system, guide plates, and later a drum launcher to maximize shooting power and accuracy. The team also developed and refined an autonomous shooting mode and added guides to improve the trajectory of launched game pieces. During competition, the robot continued evolving, with nearly six redesigns completed in less than two days as the team adapted to challenges and mechanical failures. See the images in the carousel above.  In competition, our robot primarily focused on defense and game piece scoring, helping block opposing alliances while supporting our teammates on the field. Despite limited materials, resources, and experience as a rookie team, we persevered through mechanical issues and constant repairs, including replacing bent steel hex bars multiple times throughout the event. The robot represented not only our technical growth, but also our teamwork, creativity, and determination as a first year team participating in the FIRST Robotics Competition. placing 23/28.
