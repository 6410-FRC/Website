title: Team
intro: Meet the students and mentors behind WINGNUTS 6410.
body:
  - The Robotics Team is free to join, and made available to every attending Everett Alvarez High School Student. No prior experience is needed at all, what really matters is the passion to learn, be serious, and willing to grow. Talk to Ms. Kumar in room 106/107 for an application, or simply come by to observe the teams operations to learn more.
photo: 
  src: /images/2026/Teampic.jpg
  alt: Team Picture Eagle 
subteams:
  title: Subteams
  intro: Everyone joins at least one subteam. Most end up supporting multiple subteams, no prior experience needed. 
values:
  title: How we work
  items:
    - title: Students lead
      body: Students run each subteam and make the hard hitting technical & non - technical descisions. 
    - title: Mentors guide
      body:  Focus on tool safety, passing skills down, ask questions, and keep the team operating.
    - title: Everyone belongs
      body: No experience is required. We will teach you what you need to know.
mentors:
  title: Mentors
  body: The engineers & teachers who work alongside our students through the season. Mentors help to foster the idea of Gracious Professionalism® and have the students do as much of the work as possible.
  photo:
    src: "/images/2026/In progress photo.jpg"
    expand: false
    alt: Mentor photo coming soon
cta:
  title: Want to be part of it?
  body: New members & mentors are welcome anytime!
  actionLabel: Join the team
