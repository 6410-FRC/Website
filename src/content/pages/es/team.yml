title: Equipo
intro: Conoce a los estudiantes y mentores de WINGNUTS 6410.
body:
  - Unirte al equipo de robótica es gratis y cualquier estudiante de Everett Alvarez High School puede participar. Solo necesitas ganas de aprender, compromiso y disposición para crecer. Habla con la Sra. Kumar en el salón 106/107 para solicitar una inscripción o ven a ver cómo trabaja el equipo.
photo:
  src: /images/2026/Teampic.jpg
  alt: Foto del equipo con el águila
subteams:
  title: Subequipos
  intro: Cada integrante se une al menos a un subequipo. La mayoría termina apoyando a varios. No se requiere experiencia previa.
values:
  title: Cómo trabajamos
  items:
    - title: Los estudiantes lideran
      body: Los estudiantes dirigen cada subequipo y toman las decisiones importantes en las áreas técnicas y de gestión.
    - title: Los mentores guían
      body: Los mentores enseñan a usar las herramientas con seguridad, comparten lo que saben, hacen preguntas y ayudan a que el equipo siga funcionando.
    - title: Hay lugar para todos
      body: Te enseñamos todo lo que necesitas saber para empezar.
mentors:
  title: Mentores
  body: Ingenieros y docentes acompañan a los estudiantes durante la temporada. Los mentores fomentan el profesionalismo con respeto (Gracious Professionalism®) y ayudan a que los estudiantes hagan por sí mismos la mayor parte del trabajo.
  photo:
    src: /images/2026/In progress photo.jpg
    alt: Foto de los mentores próximamente
cta:
  title: ¿Quieres ser parte del equipo?
  body: ¡Puedes unirte como estudiante o mentor en cualquier momento!
  actionLabel: Únete al equipo
