title: ¡Únete al equipo!
intro: ""
body:
  - Si eres estudiante y quieres construir, profesional y quieres ser mentor, o una empresa que quiere ayudar, aquí hay un lugar para ti.
paths:
  - title: Estudiantes
    body: Cualquier estudiante de Everett Alvarez High School puede unirse. No se necesita experiencia. Puedes aprender diseño, fabricación, cableado y programación. También puedes ayudar a diseñar productos del equipo, difundir nuestro trabajo, conseguir patrocinios u organizar actividades para jóvenes.
    steps:
      - Completa una solicitud con la Sra. Kumar
      - Llena el formulario de interés
    actionLabel: Conoce al equipo
  - title: Mentores
    body: Invitamos a ingenieros, programadores, especialistas en maquinado, docentes y personas de la comunidad a ser mentores. Los mentores comparten sus conocimientos, mantienen el taller seguro y dejan que los estudiantes tomen las decisiones.
    steps:
      - Cuéntanos sobre tu experiencia
      - Completa el proceso de voluntariado de la escuela
      - Acompáñanos en el taller
    actionLabel: Pregunta cómo ser mentor
  - title: Patrocinadores
    body: Empresas y miembros de la comunidad financian las piezas, las herramientas, la inscripción y los viajes que hacen posible la temporada. Cualquier aporte ayuda. También agradecemos las donaciones en especie.
    steps:
      - Lee nuestra página de patrocinio
      - Contacta al equipo
      - Recibe reconocimiento en cada evento
    actionLabel: Ver opciones de patrocinio
meeting:
  title: Cuándo y dónde nos reunimos
  body: Nos reunimos en el salón 106/107 de Everett Alvarez High School. Durante el ciclo escolar, WINGNUTS se reúne los jueves durante el periodo de tutoría (Homeroom), los viernes después de clases y los sábados por la mañana. Los horarios pueden cambiar y las reuniones pueden ser más frecuentes al acercarse las competencias.
