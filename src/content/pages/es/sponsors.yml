title: Patrocinadores
intro: " "
body:
  - Gracias a quienes hacen posible cada temporada para los estudiantes de Salinas. Construir un robot de competencia requiere piezas, herramientas, cuotas de inscripción y viajes. Nuestros patrocinadores cubren esos costos y les dan a los estudiantes oportunidades de aplicar la ingeniería en la práctica.
why:
  title: ¿Por qué patrocinar al equipo?
  items:
    - title: Financia la temporada
      body: Apoya a los estudiantes cubriendo los costos de inscripción, materiales, herramientas, equipo de seguridad, comida, hospedaje y transporte a las competencias.
    - title: Apoya a los estudiantes
      body: Impulsa la educación práctica en STEM para estudiantes de preparatoria del Valle de Salinas. También aceptamos donaciones en especie, como alimentos, tarjetas de regalo, madera y otros materiales.
    - title: Recibe reconocimiento
      body: Tu nombre aparecerá en el robot, el área del equipo en las competencias, las playeras, este sitio web y en cada evento.
tiers:
  title: Niveles de patrocinio
  intro: Consulta los montos y todos los beneficios en nuestro paquete de patrocinio.
  items:
    - name: Colaborador
      benefits:
        - Nombre en la lista de colaboradores del equipo
        - Agradecimiento en las redes sociales del equipo
    - name: Bronce
      benefits:
        - Nombre en la lona del equipo
        - Reconocimiento en las redes sociales del equipo
        - Todos los beneficios del nivel Colaborador
    - name: Oro
      benefits:
        - Lugar destacado en la lona del área del equipo
        - Reconocimiento verbal en competencias y eventos comunitarios
        - Todos los beneficios del nivel Plata
    - name: Platino
      benefits:
        - Recorrido por el taller
        - Placa personalizada
        - Todos los beneficios del nivel Oro
  packetNote: El paquete de patrocinio estará disponible para descargar pronto. ¿Te interesa patrocinar al equipo? Escribe a 2026frc6410@gmail.com
wall:
  tierNames:
    Diamond: Diamante
