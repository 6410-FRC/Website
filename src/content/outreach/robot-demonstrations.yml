titleEn: Trunk or Treat
titleEs: Trunk or Treat
bodyEn: We bring the robot to community events so people can see it drive, ask questions, and meet the students who built it. We were honored to participate at a community center located in Castroville where we re-branded to "candy-bot." We used our robot to pass out sweet treats and team goodies!
bodyEs: Llevamos el robot a eventos comunitarios para que la gente lo vea en acción, haga preguntas y conozca a los estudiantes que lo construyeron. Tuvimos el honor de participar en un centro comunitario de Castroville, donde convertimos el robot en Candy Bot y lo usamos para repartir dulces y obsequios del equipo.
